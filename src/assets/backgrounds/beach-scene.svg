<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#skyGradient)"/>
  <!-- Beach/ocean -->
  <rect y="500" width="1200" height="300" fill="#8B7355"/>
  <!-- Water -->
  <rect y="600" width="1200" height="200" fill="#4A90E2"/>
  <!-- Waves -->
  <ellipse cx="200" cy="620" rx="80" ry="15" fill="#87CEEB" opacity="0.6"/>
  <ellipse cx="600" cy="640" rx="100" ry="20" fill="#87CEEB" opacity="0.6"/>
  <ellipse cx="1000" cy="630" rx="90" ry="18" fill="#87CEEB" opacity="0.6"/>
  <text x="600" y="400" text-anchor="middle" font-size="32" fill="#FFFFFF" opacity="0.7">Beach Scene</text>
</svg>